[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sure-eval-node-tts-transcription"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."sure_eval.nodes"]
"transcription/sample_tts_asr" = "sure_eval_node_tts_transcription.node"

[project.entry-points."sure_eval.routes"]
tts = "sure_eval_node_tts_transcription.routes"

[tool.setuptools]
packages = ["sure_eval_node_tts_transcription"]
