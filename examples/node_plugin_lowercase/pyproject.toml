[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sure-eval-node-lowercase"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."sure_eval.nodes"]
"normalization/lowercase_norm" = "sure_eval_node_lowercase.node"

[tool.setuptools]
packages = ["sure_eval_node_lowercase"]
